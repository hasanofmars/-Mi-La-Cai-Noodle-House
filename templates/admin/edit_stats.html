{% extends "admin/base_admin.html" %} {% block title %}Edit Stats — Admin{%
endblock %} {% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <a
    href="/admin/"
    class="inline-flex items-center gap-1.5 text-sm text-warm-400 hover:text-primary-500 mb-6 transition-colors"
  >
    <i class="fa-solid fa-arrow-left text-xs"></i> Back to Dashboard
  </a>
  <h1 class="text-3xl font-serif font-bold text-warm-900 mb-1">Stats</h1>
  <p class="text-warm-400 text-sm mb-8">Edit the statistics counters.</p>

  <form
    method="POST"
    class="bg-white rounded-2xl p-6 sm:p-8 border border-warm-100/40 shadow-sm space-y-4"
  >
    <div id="stats-container" class="space-y-4">
      {% for s in data.stats %}
      <div class="stat-row bg-warm-50 rounded-xl p-4 border border-warm-100/50">
        <div class="grid sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Number</label
            >
            <input
              type="text"
              name="num"
              value="{{ s.num }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Suffix</label
            >
            <input
              type="text"
              name="suf"
              value="{{ s.suf }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Label</label
            >
            <input
              type="text"
              name="label"
              value="{{ s.label }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Icon (FontAwesome)</label
            >
            <input
              type="text"
              name="icon"
              value="{{ s.icon }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
        </div>
        <button
          type="button"
          onclick="this.closest('.stat-row').remove()"
          class="mt-2 text-xs text-red-400 hover:text-red-600 transition-colors"
        >
          <i class="fa-solid fa-trash-can mr-1"></i> Remove
        </button>
      </div>
      {% endfor %}
    </div>
    <button
      type="button"
      onclick="addStat()"
      class="px-4 py-2 bg-warm-50 hover:bg-warm-100 border border-dashed border-warm-300 rounded-xl text-xs text-warm-500 font-semibold transition-all"
    >
      <i class="fa-solid fa-plus mr-1"></i> Add Stat
    </button>
    <div class="flex items-center gap-3 pt-2">
      <button
        type="submit"
        class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-primary-500/20"
      >
        <i class="fa-solid fa-save mr-1.5"></i> Save Changes
      </button>
      <a
        href="/admin/"
        class="px-6 py-2.5 border border-warm-200 text-warm-600 rounded-xl font-semibold text-sm hover:bg-warm-50 transition-all"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %} {% block scripts %}
<script>
  function addStat() {
    const container = document.getElementById("stats-container");
    const div = document.createElement("div");
    div.className =
      "stat-row bg-warm-50 rounded-xl p-4 border border-warm-100/50";
    div.innerHTML = `<div class="grid sm:grid-cols-4 gap-3">
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Number</label><input type="text" name="num" value="0" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Suffix</label><input type="text" name="suf" value="+" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Label</label><input type="text" name="label" value="New Stat" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Icon</label><input type="text" name="icon" value="fa-star" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
  </div>
  <button type="button" onclick="this.closest('.stat-row').remove()" class="mt-2 text-xs text-red-400 hover:text-red-600 transition-colors"><i class="fa-solid fa-trash-can mr-1"></i> Remove</button>`;
    container.appendChild(div);
  }
</script>
{% endblock %}
