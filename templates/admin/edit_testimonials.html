{% extends "admin/base_admin.html" %} {% block title %}Edit Testimonials —
Admin{% endblock %} {% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <a
    href="/admin/"
    class="inline-flex items-center gap-1.5 text-sm text-warm-400 hover:text-primary-500 mb-6 transition-colors"
  >
    <i class="fa-solid fa-arrow-left text-xs"></i> Back to Dashboard
  </a>
  <h1 class="text-3xl font-serif font-bold text-warm-900 mb-1">Testimonials</h1>
  <p class="text-warm-400 text-sm mb-8">Manage guest reviews.</p>

  <form
    method="POST"
    class="bg-white rounded-2xl p-6 sm:p-8 border border-warm-100/40 shadow-sm space-y-4"
  >
    <div id="testimonials-container" class="space-y-4">
      {% for t in data.testimonials %}
      <div
        class="testimonial-row bg-warm-50 rounded-xl p-4 border border-warm-100/50"
      >
        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Stars</label
            >
            <input
              type="text"
              name="stars"
              value="{{ t.stars }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Name</label
            >
            <input
              type="text"
              name="name"
              value="{{ t.name }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Initial</label
            >
            <input
              type="text"
              name="initial"
              value="{{ t.initial }}"
              maxlength="1"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Gradient (from-? to-?)</label
            >
            <input
              type="text"
              name="gradient"
              value="{{ t.gradient }}"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-warm-500 mb-1"
              >Quote</label
            >
            <textarea
              name="quote"
              rows="2"
              class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
            >
{{ t.quote }}</textarea
            >
          </div>
        </div>
        <button
          type="button"
          onclick="this.closest('.testimonial-row').remove()"
          class="mt-2 text-xs text-red-400 hover:text-red-600 transition-colors"
        >
          <i class="fa-solid fa-trash-can mr-1"></i> Remove
        </button>
      </div>
      {% endfor %}
    </div>
    <button
      type="button"
      onclick="addTestimonial()"
      class="px-4 py-2 bg-warm-50 hover:bg-warm-100 border border-dashed border-warm-300 rounded-xl text-xs text-warm-500 font-semibold transition-all"
    >
      <i class="fa-solid fa-plus mr-1"></i> Add Testimonial
    </button>
    <div class="flex items-center gap-3 pt-2">
      <button
        type="submit"
        class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-primary-500/20"
      >
        <i class="fa-solid fa-save mr-1.5"></i> Save Changes
      </button>
      <a
        href="/admin/"
        class="px-6 py-2.5 border border-warm-200 text-warm-600 rounded-xl font-semibold text-sm hover:bg-warm-50 transition-all"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %} {% block scripts %}
<script>
  function addTestimonial() {
    const c = document.getElementById("testimonials-container");
    const d = document.createElement("div");
    d.className =
      "testimonial-row bg-warm-50 rounded-xl p-4 border border-warm-100/50";
    d.innerHTML = `<div class="grid sm:grid-cols-2 gap-3">
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Stars</label><input type="text" name="stars" value="★★★★★" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Name</label><input type="text" name="name" value="New Guest" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Initial</label><input type="text" name="initial" value="N" maxlength="1" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div><label class="block text-xs font-semibold text-warm-500 mb-1">Gradient</label><input type="text" name="gradient" value="from-primary-500 to-primary-600" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    <div class="sm:col-span-2"><label class="block text-xs font-semibold text-warm-500 mb-1">Quote</label><textarea name="quote" rows="2" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10">Amazing food!</textarea></div>
  </div>
  <button type="button" onclick="this.closest('.testimonial-row').remove()" class="mt-2 text-xs text-red-400 hover:text-red-600 transition-colors"><i class="fa-solid fa-trash-can mr-1"></i> Remove</button>`;
    c.appendChild(d);
  }
</script>
{% endblock %}
