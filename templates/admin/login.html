{% extends "admin/base_admin.html" %} {% block title %}Login — Admin{% endblock
%} {% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#111318] px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-2xl shadow-primary-500/20"
      >
        🍜
      </div>
      <h1 class="text-2xl font-display font-bold text-white">Admin Login</h1>
      <p class="text-[#6b7280] text-sm mt-1">Mi La-Cai Noodle House</p>
    </div>
    <div class="bg-[#1e2128] border border-[#2a2f38] rounded-2xl p-8">
      <form method="POST" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-[#9ca3b0] mb-1.5"
            >Username</label
          >
          <input
            type="text"
            name="username"
            required
            class="w-full px-4 py-3 bg-[#2d323a] border border-[#3a3f48] rounded-xl text-[#e8edf2] text-sm placeholder:text-[#5a6070] focus:border-primary-500/50 focus:outline-none focus:ring-1 focus:ring-primary-500/20 transition-all"
            placeholder="Enter username"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-[#9ca3b0] mb-1.5"
            >Password</label
          >
          <input
            type="password"
            name="password"
            required
            class="w-full px-4 py-3 bg-[#2d323a] border border-[#3a3f48] rounded-xl text-[#e8edf2] text-sm placeholder:text-[#5a6070] focus:border-primary-500/50 focus:outline-none focus:ring-1 focus:ring-primary-500/20 transition-all"
            placeholder="Enter password"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white rounded-xl font-bold text-sm transition-all duration-300 shadow-lg shadow-primary-500/20 hover:shadow-xl hover:shadow-primary-500/30"
        >
          <i class="fa-solid fa-lock-open mr-2"></i> Sign In
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-[#5a6070] mt-6">
      <i class="fa-solid fa-shield-halved mr-1"></i> Secure admin access
    </p>
  </div>
</div>
{% endblock %}
