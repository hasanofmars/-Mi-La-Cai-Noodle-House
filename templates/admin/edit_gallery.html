{% extends "admin/base_admin.html" %} {% block title %}Edit Gallery — Admin{%
endblock %} {% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <a
    href="/admin/"
    class="inline-flex items-center gap-1.5 text-sm text-warm-400 hover:text-primary-500 mb-6 transition-colors"
  >
    <i class="fa-solid fa-arrow-left text-xs"></i> Back to Dashboard
  </a>
  <h1 class="text-3xl font-serif font-bold text-warm-900 mb-1">Gallery</h1>
  <p class="text-warm-400 text-sm mb-8">Manage gallery images.</p>

  <form
    method="POST"
    class="bg-white rounded-2xl p-6 sm:p-8 border border-warm-100/40 shadow-sm space-y-4"
  >
    <div id="gallery-container" class="space-y-4">
      {% for g in data.gallery %}
      <div
        class="gallery-row bg-warm-50 rounded-xl p-4 border border-warm-100/50"
      >
        <div class="flex gap-4 items-start">
          {% if g.img %}
          <img
            src="{{ g.img }}"
            alt=""
            class="w-20 h-20 rounded-xl object-cover shrink-0 border border-warm-200"
          />
          {% endif %}
          <div class="flex-1 grid sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-warm-500 mb-1"
                >Image URL</label
              >
              <input
                type="url"
                name="img"
                value="{{ g.img }}"
                class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-warm-500 mb-1"
                >Caption</label
              >
              <input
                type="text"
                name="caption"
                value="{{ g.caption }}"
                class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-warm-500 mb-1"
                >CSS Span Classes</label
              >
              <input
                type="text"
                name="span"
                value="{{ g.span }}"
                class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"
              />
            </div>
          </div>
          <button
            type="button"
            onclick="this.closest('.gallery-row').remove()"
            class="px-3 py-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all text-sm shrink-0"
          >
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>
      {% endfor %}
    </div>
    <button
      type="button"
      onclick="addGalleryItem()"
      class="px-4 py-2 bg-warm-50 hover:bg-warm-100 border border-dashed border-warm-300 rounded-xl text-xs text-warm-500 font-semibold transition-all"
    >
      <i class="fa-solid fa-plus mr-1"></i> Add Image
    </button>
    <div class="flex items-center gap-3 pt-2">
      <button
        type="submit"
        class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-primary-500/20"
      >
        <i class="fa-solid fa-save mr-1.5"></i> Save Changes
      </button>
      <a
        href="/admin/"
        class="px-6 py-2.5 border border-warm-200 text-warm-600 rounded-xl font-semibold text-sm hover:bg-warm-50 transition-all"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %} {% block scripts %}
<script>
  function addGalleryItem() {
    const c = document.getElementById("gallery-container");
    const d = document.createElement("div");
    d.className =
      "gallery-row bg-warm-50 rounded-xl p-4 border border-warm-100/50";
    d.innerHTML = `<div class="flex gap-4 items-start">
    <div class="w-20 h-20 rounded-xl bg-warm-100 border border-warm-200 flex items-center justify-center text-warm-300 shrink-0"><i class="fa-solid fa-image"></i></div>
    <div class="flex-1 grid sm:grid-cols-2 gap-3">
      <div class="sm:col-span-2"><label class="block text-xs font-semibold text-warm-500 mb-1">Image URL</label><input type="url" name="img" value="https://" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
      <div><label class="block text-xs font-semibold text-warm-500 mb-1">Caption</label><input type="text" name="caption" value="New Photo" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
      <div><label class="block text-xs font-semibold text-warm-500 mb-1">Span Classes</label><input type="text" name="span" value="" class="w-full px-3 py-2 bg-white border border-warm-200 rounded-lg text-sm text-warm-800 font-mono text-xs focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-500/10"></div>
    </div>
    <button type="button" onclick="this.closest('.gallery-row').remove()" class="px-3 py-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all text-sm shrink-0"><i class="fa-solid fa-trash-can"></i></button>
  </div>`;
    c.appendChild(d);
  }
</script>
{% endblock %}
